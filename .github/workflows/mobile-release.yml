name: OKRI mobile store build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to build
        type: choice
        required: true
        options: [android, ios]
      destination:
        description: Build only, or upload the signed artifact to the internal store track
        type: choice
        required: true
        default: artifact
        options: [artifact, store]
permissions:
  contents: read
concurrency:
  group: okri-mobile-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/main' && inputs.platform == 'android'
    environment: mobile-production
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_ARTIFACT: mobile/artifacts/okri-android-1.0.0-2.aab
      OKRI_ANDROID_VERSION_CODE: "2"
      OKRI_UPLOAD_KEY_ALIAS: ${{ secrets.OKRI_ANDROID_KEY_ALIAS }}
      OKRI_UPLOAD_KEY_PASSWORD: ${{ secrets.OKRI_ANDROID_KEY_PASSWORD }}
      OKRI_UPLOAD_STORE_PASSWORD: ${{ secrets.OKRI_ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Materialize Android upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.OKRI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/okri-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/okri-signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/okri-signing/upload.jks"
          echo "OKRI_UPLOAD_STORE_FILE=$RUNNER_TEMP/okri-signing/upload.jks" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run test:mobile-contract
      - run: npm run typecheck --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build:android --prefix mobile
      - uses: actions/upload-artifact@v4
        with:
          name: okri-android-${{ github.sha }}
          path: |
            ${{ env.ANDROID_ARTIFACT }}
            mobile/artifacts/okri-android-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload exact AAB to Play internal draft
        if: inputs.destination == 'store'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          gem install fastlane --no-document
          fastlane supply --json_key_data "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" --package_name ai.okri.app --aab "$ANDROID_ARTIFACT" --track internal --release_status draft --skip_upload_metadata true --skip_upload_images true --skip_upload_screenshots true
      - name: Remove signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/okri-signing"

  ios:
    if: github.ref == 'refs/heads/main' && inputs.platform == 'ios'
    environment: mobile-production
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_ARTIFACT: mobile/artifacts/okri-ios-1.0.0-1.ipa
      OKRI_IOS_BUILD_NUMBER: "1"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Materialize App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          test -n "$ASC_PRIVATE_KEY"
          test -n "$APPLE_TEAM_ID"
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          install -d -m 700 "$RUNNER_TEMP/okri-signing"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/okri-signing/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/okri-signing/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/okri-signing/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Install approved Apple distribution identity
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.OKRI_IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.OKRI_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.OKRI_IOS_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROFILE_BASE64"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/okri-signing/distribution.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/okri-signing/app-store.mobileprovision"
          chmod 600 "$RUNNER_TEMP/okri-signing/"*
          security cms -D -i "$RUNNER_TEMP/okri-signing/app-store.mobileprovision" > "$RUNNER_TEMP/okri-signing/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/okri-signing/profile.plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/okri-signing/profile.plist")" = "$APPLE_TEAM_ID.ai.okri.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' "$RUNNER_TEMP/okri-signing/profile.plist")" = 'false'
          PROFILE_UUID="$PROFILE_UUID" node --input-type=module -e 'import {iosExportOptions} from "./mobile/scripts/ios-export-options.mjs"; iosExportOptions(process.env.APPLE_TEAM_ID, process.env.PROFILE_UUID);'
          KEYCHAIN="$RUNNER_TEMP/okri-signing/distribution.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/okri-signing/distribution.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          for PROFILE_DIRECTORY in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIRECTORY"
            cp "$RUNNER_TEMP/okri-signing/app-store.mobileprovision" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"
          done
          echo "OKRI_IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run test:mobile-contract
      - run: npm run typecheck --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run build:ios --prefix mobile
      - uses: actions/upload-artifact@v4
        with:
          name: okri-ios-${{ github.sha }}
          path: |
            ${{ env.IOS_ARTIFACT }}
            mobile/artifacts/okri-ios-manifest.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload exact IPA to TestFlight
        if: inputs.destination == 'store'
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/okri-signing
        run: xcrun altool --upload-app --type ios --file "$IOS_ARTIFACT" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/okri-signing/distribution.keychain-db" || true
          if [ -n "${OKRI_IOS_PROFILE_UUID:-}" ]; then
            rm -f -- "$HOME/Library/MobileDevice/Provisioning Profiles/$OKRI_IOS_PROFILE_UUID.mobileprovision"
            rm -f -- "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$OKRI_IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf -- "$RUNNER_TEMP/okri-signing"
