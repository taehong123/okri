name: OKRI mobile compatibility
on:
  pull_request:
  push:
    branches: [main, codex/native-mobile]
  workflow_dispatch:
  schedule:
    # Tuesday 10:00 Asia/Seoul. Candidates are not automatic public releases.
    - cron: "0 1 * * 2"
permissions:
  contents: read
concurrency:
  group: mobile-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    # Playwright 1.55 supports Ubuntu 24.04; ubuntu-latest now resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run test:mobile-contract
      - run: npm test --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npx tsc --noEmit
      - name: Check MCP data connections and permission dispatch
        run: node --test --test-concurrency=1 tests/workspace-invite-links.test.mjs tests/daily-report.test.mjs tests/daily-report-delivery.test.mjs tests/mcp-daily-reports.test.mjs tests/slack-bot-delivery.test.mjs tests/daily-team-digest.test.mjs tests/mcp-data-connections.test.mjs tests/project-metric-schedules.test.mjs tests/project-contributions.test.mjs tests/workspace-backups.test.mjs tests/work-intake.test.mjs tests/okri-manual.test.mjs tests/slack-change-and-manual.test.mjs
      - run: npm run build
      - run: npm run preview:export --prefix mobile
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config mobile/playwright.config.mjs --workers=1
      - name: Export both native bundles
        working-directory: mobile
        run: |
          npx expo export --platform ios --output-dir dist/ios --max-workers 1
          npx expo export --platform android --output-dir dist/android --max-workers 1
      - name: Record immutable candidate
        run: node mobile/scripts/candidate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-candidate-${{ github.sha }}
          path: |
            mobile/artifacts/candidate.json
            mobile/dist
          retention-days: 30
