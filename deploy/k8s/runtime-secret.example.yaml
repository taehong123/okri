# Do not apply this file and never commit actual values.
# Create/update `okri-runtime` only from the deployment account's secret store.
apiVersion: v1
kind: Secret
metadata:
  name: okri-runtime
  namespace: okri
type: Opaque
stringData:
  OKRI_SCHEDULER_TOKEN: replace-with-a-random-48-byte-secret
  OKRI_PUBLIC_URL: https://okri.ai
  OKRI_APP_URL: https://okri.ai
  GOOGLE_CLIENT_ID: copied-from-current-runtime
  GOOGLE_CLIENT_SECRET: copied-from-current-runtime
  GOOGLE_TOKEN_ENCRYPTION_KEY: copied-from-current-runtime
  SLACK_CLIENT_ID: copied-from-current-runtime
  SLACK_CLIENT_SECRET: copied-from-current-runtime
  SLACK_SIGNING_SECRET: copied-from-current-runtime
  SLACK_TOKEN_ENCRYPTION_KEY: copied-from-current-runtime
  OPENAI_API_KEY: copied-from-current-runtime
  ACCOUNT_DATA_ENCRYPTION_KEY: copied-from-current-runtime
