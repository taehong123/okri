apiVersion: apps/v1
kind: Deployment
metadata:
  name: okri
  labels:
    app.kubernetes.io/name: okri
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: okri
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okri
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-cred
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: busybox:1.37
          command: ["sh", "-c", "set -eu; mkdir -p /var/lib/okri; chown -R 1000:1000 /var/lib/okri; chmod 0750 /var/lib/okri"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/okri
        - name: migrate
          image: registry.allvibe.ai/okri/app:main
          imagePullPolicy: Always
          command: ["node", "--experimental-sqlite", "scripts/selfhost-migrate.mjs"]
          env:
            - name: OKRI_DATA_PATH
              value: /var/lib/okri
            - name: OKRI_DB_PATH
              value: /var/lib/okri/okri.sqlite
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/okri
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: registry.allvibe.ai/okri/app:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: OKRI_DATA_PATH
              value: /var/lib/okri
            - name: OKRI_DB_PATH
              value: /var/lib/okri/okri.sqlite
            - name: OKRI_STORAGE_PATH
              value: /var/lib/okri/storage
            - name: OKRI_BACKUP_PATH
              value: /var/lib/okri/backups
          envFrom:
            - secretRef:
                name: okri-runtime
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/okri
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/okri
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
