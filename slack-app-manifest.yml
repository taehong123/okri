display_information:
  name: OKRI
  description: Connect OKRs, daily work, Projects, and Tasks.
  background_color: "#171717"
features:
  bot_user:
    display_name: OKRI
    always_online: false
  slash_commands:
    - command: /okri
      url: https://okri.ai/api/slack/commands
      description: Capture a Task or open your daily update.
      usage_hint: daily | <Task details>
      should_escape: false
oauth_config:
  redirect_urls:
    - https://okri.ai/api/slack/callback
    - https://okrptr.com/api/slack/callback
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - im:history
      - users:read
      - users:read.email
      - channels:read
      - channels:join
      - groups:read
      - channels:history
      - groups:history
      - app_mentions:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://okri.ai/api/slack/interactions
    message_menu_options_url: https://okri.ai/api/slack/interactions
  event_subscriptions:
    request_url: https://okri.ai/api/slack/events
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
